[project]
name = "claudemol"
version = "0.5.0"
description = "Structural biology skills for Claude Code"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "claude-agent-sdk",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
markers = [
    "slow: Agent SDK tests (spawns Claude sessions, costs tokens)",
]
