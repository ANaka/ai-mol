[project]
name = "claudemol"
version = "0.5.0"
description = "Structural biology skills for Claude Code"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "claude-agent-sdk",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not slow and not sonnet and not opus'"
markers = [
    "slow: Agent SDK tests - Haiku (spawns Claude sessions, costs tokens)",
    "sonnet: Agent SDK tests - Sonnet (higher quality, higher cost)",
    "opus: Agent SDK tests - Opus (highest quality, highest cost)",
]
